  <style> /* 開始設定畫面樣式 */
    :root { color-scheme: light; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; } /* 設定繁體中文字型 */
    * { box-sizing: border-box; } /* 讓尺寸計算包含邊框與內距 */

    body { background: #9bcbd0; color: #23323a; } /* 設定水面底色與文字顏色 */
    canvas { display: block; width: 100%; height: 100%; } /* 移除畫布基線空隙並填滿畫面 */
    .hud { position: fixed; z-index: 2; top: 20px; left: 22px; padding: 17px 21px; border: 1px solid rgba(255,255,255,.82); border-radius: 20px; background: rgba(255,255,255,.9); box-shadow: 0 12px 30px rgba(48,95,101,.15); backdrop-filter: blur(8px); } /* 建立左上角資訊卡 */
    .eyebrow { margin: 0 0 4px; color: #d27543; font-size: 11px; font-weight: 900; letter-spacing: .16em; } /* 強調頁面副標 */
    h1 { margin: 0; font-size: clamp(20px, 2.4vw, 29px); line-height: 1.15; font-weight: 950; letter-spacing: .04em; } /* 設定主標題樣式 */
    .subtitle { margin: 8px 0 0; color: #69767a; font-size: 12px; font-weight: 700; } /* 設定副標題樣式 */
    .tip { position: fixed; z-index: 2; top: 20px; right: 22px; padding: 13px 19px; border: 0; border-radius: 999px; background: #f0c64e; color: #302c23; box-shadow: 0 5px 0 #d9a935, 0 10px 24px rgba(65,84,71,.16); font: inherit; font-size: 13px; font-weight: 900; letter-spacing: .04em; } /* 建立右上角操作提示 */
    #stamp-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; } /* 讓 p5.js 標籤覆蓋場景但將滑鼠事件交給底層畫布 */
    .stamp-progress { display: inline-flex; gap: 8px; align-items: center; margin-top: 11px; padding: 6px 10px; border-radius: 999px; background: #fff3da; color: #725337; font-size: 12px; font-weight: 850; } /* 顯示左上角集章數量 */
    .stamp-progress strong { color: #d66d3f; font-variant-numeric: tabular-nums; } /* 突顯已完成集章數 */
    .vendor-call { position: fixed; z-index: 1; pointer-events: none; padding: 5px 9px; border: 2px solid rgba(255,255,255,.95); border-radius: 15px; background: #fff7db; color: #a94832; box-shadow: 0 5px 14px rgba(50,81,84,.18); white-space: nowrap; font-size: 11px; font-weight: 950; transform: translate(-100%, -100%); transition: opacity .2s ease; } /* 建立跟隨攤販的阿給叫賣對話框 */
    .vendor-call::after { position: absolute; bottom: -7px; left: calc(80% - 6px); width: 10px; height: 10px; border-right: 2px solid rgba(255,255,255,.95); border-bottom: 2px solid rgba(255,255,255,.95); background: #fff7db; content: ""; transform: rotate(45deg); } /* 加上指向攤販的對話框尾巴 */
    .stamp-description { position: fixed; z-index: 2; bottom: 20px; left: 50%; display: none; width: min(460px, calc(100vw - 32px)); padding: 12px 17px; border: 1px solid rgba(255,255,255,.86); border-radius: 16px; background: rgba(255,255,255,.93); box-shadow: 0 8px 24px rgba(50,81,84,.16); color: #4b5c5b; font-size: 13px; font-weight: 700; line-height: 1.55; text-align: center; transform: translateX(-50%); } /* 在畫面下方顯示最近集章地點介紹 */
    .stamp-description.is-visible { display: block; } /* 集章後才顯示地點介紹 */
    .stamp-complete { position: fixed; z-index: 4; top: 24px; left: 50%; display: none; padding: 11px 18px; border: 2px solid white; border-radius: 999px; background: #4d9b70; box-shadow: 0 7px 20px rgba(45,99,69,.28); color: white; font-size: 15px; font-weight: 950; white-space: nowrap; transform: translateX(-50%); } /* 建立全部集章完成提示 */
    .stamp-complete.is-visible { display: block; } /* 全部集滿後顯示完成訊息 */
    .footer { position: fixed; z-index: 2; right: 22px; bottom: 18px; padding: 10px 15px; border: 1px solid rgba(255,255,255,.7); border-radius: 14px; background: rgba(255,255,255,.78); color: #4b6668; font-size: 11px; font-weight: 800; letter-spacing: .04em; } /* 建立底部操作說明 */
    @media (max-width: 600px) { .hud { top: 12px; left: 12px; padding: 12px 14px; border-radius: 16px; } .tip { top: 12px; right: 12px; padding: 11px 13px; font-size: 11px; } .footer { right: 12px; bottom: 12px; font-size: 10px; } .stamp-progress { margin-top: 8px; font-size: 11px; } .stamp-description { bottom: 14px; padding: 10px 12px; font-size: 12px; } .stamp-complete { top: 12px; font-size: 12px; } } /* 在窄螢幕縮小浮動介面 */
  </style> <!-- 結束畫面樣式 -->

<body> <!-- 開始頁面內容 -->
  <header class="hud"> <!-- 建立左上角標題資訊 -->
    <p class="eyebrow">TAMSUI · RIVER ISLANDS</p> <!-- 顯示淡水河岸英文小標 -->
    <h1>淡水一日遊</h1> <!-- 顯示作品主標題 -->
    <p class="subtitle">五座河岸地標，沿著金色步橋相連</p> <!-- 說明島嶼場景內容 -->
    <div class="stamp-progress" role="status">集章進度 <strong id="stamp-count">0 / 5</strong></div> <!-- 顯示目前已收集印章數量 -->
  </header> <!-- 結束左上角標題資訊 -->
  <div class="tip">方向鍵移動　點地面前往　拖曳旋轉</div> <!-- 顯示移動與鏡頭操作方式 -->
  <div class="vendor-call" id="vendor-call">好吃的阿給！</div> <!-- 顯示老街攤販老闆的叫賣內容 -->
  <aside class="stamp-description" id="stamp-description" aria-live="polite"></aside> <!-- 顯示剛完成集章地點的介紹 -->
  <div class="stamp-complete" id="stamp-complete" role="status">五座島嶼集章完成！淡水探索之旅成功</div> <!-- 顯示全部集章完成訊息 -->
  <div class="footer">低多邊形河景　·　柔光與水波動態</div> <!-- 顯示場景風格提示 -->
  <script type="module"> // 開始執行 Three.js 場景程式
    import * as THREE from "three"; // 載入 Three.js 核心模組
    import { OrbitControls } from "three/addons/controls/OrbitControls.js"; // 載入滑鼠旋轉與縮放控制
    const scene = new THREE.Scene(); // 建立三維場景
    scene.background = new THREE.Color("#9bcbd0"); // 設定淡藍色水面背景
    const camera = new THREE.OrthographicCamera(-16, 16, 16, -16, 0.1, 150); // 建立正交攝影機
    camera.position.set(19, 25, 21); // 從右上方斜俯視島嶼群
    camera.lookAt(0, 0, 0); // 將攝影機對準場景中央
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false }); // 建立抗鋸齒 WebGL 繪圖器
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 限制像素比以兼顧效能
    renderer.setSize(window.innerWidth, window.innerHeight); // 將繪圖器調整為視窗大小
    renderer.shadowMap.enabled = true; // 開啟柔和陰影
    renderer.shadowMap.type = THREE.PCFSoftShadowMap; // 使用柔和陰影濾鏡
    renderer.outputColorSpace = THREE.SRGBColorSpace; // 使用正確的螢幕色彩空間
    renderer.toneMapping = THREE.ACESFilmicToneMapping; // 套用柔和電影色調映射
    renderer.toneMappingExposure = 1.08; // 稍微提高整體曝光
    document.body.appendChild(renderer.domElement); // 將 WebGL 畫布加入頁面
    const controls = new OrbitControls(camera, renderer.domElement); // 啟用拖曳旋轉與滾輪縮放
    controls.enableDamping = true; // 啟用平滑的鏡頭慣性
    controls.enableKeys = false; // 將方向鍵保留給主角移動
    controls.dampingFactor = 0.055; // 設定鏡頭慣性強度
    controls.minZoom = 0.72; // 限制最小縮放倍率
    controls.maxZoom = 1.8; // 限制最大縮放倍率
    controls.minPolarAngle = 0.28; // 避免鏡頭沉到水面以下
    controls.maxPolarAngle = 1.25; // 保留斜俯視角度
    controls.target.set(0, 0, 0); // 設定鏡頭旋轉中心
    const hemi = new THREE.HemisphereLight("#fff5db", "#647c72", 2.1); // 建立天空與地面柔和環境光
    scene.add(hemi); // 將環境光加入場景
    const sun = new THREE.DirectionalLight("#fff1cc", 3.2); // 建立暖色方向光
    sun.position.set(-12, 22, 13); // 設定光線從左上方照入
    sun.castShadow = true; // 開啟方向光投影
    sun.shadow.mapSize.set(2048, 2048); // 提高陰影貼圖解析度
    sun.shadow.camera.left = -26; // 設定陰影攝影機左界
    sun.shadow.camera.right = 26; // 設定陰影攝影機右界
    sun.shadow.camera.top = 26; // 設定陰影攝影機上界
    sun.shadow.camera.bottom = -26; // 設定陰影攝影機下界
    sun.shadow.bias = -0.00025; // 減少陰影表面瑕疵
    sun.shadow.radius = 5; // 擴散陰影邊緣
    scene.add(sun); // 將方向光加入場景
    const waterMat = new THREE.MeshStandardMaterial({ color: "#8fc6cc", roughness: 0.34, metalness: 0.02 }); // 建立淡藍色水面材質
    const water = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), waterMat); // 擴大水面以完整覆蓋加大後的取景範圍
    water.rotation.x = -Math.PI / 2; // 將水面轉為水平
    water.position.y = -0.28; // 將水面放在平台下方
    water.receiveShadow = true; // 讓水面承接島嶼陰影
    scene.add(water); // 將水面加入場景
    const world = new THREE.Group(); // 建立供島嶼與橋梁共用的動態群組
    scene.add(world); // 將動態群組加入場景
    const mat = (color, roughness = 0.86) => new THREE.MeshStandardMaterial({ color, roughness }); // 建立共用標準材質工廠
    const colors = { cream: "#f5e8c9", brick: "#c9623e", roof: "#d77745", green: "#98bd78", grass: "#a9c981", stone: "#d7c9a8", white: "#fff8e8", dark: "#35444a", gold: "#efbd38", wood: "#a87951", blue: "#77aeb2" }; // 定義島嶼共用色票
    const groundY = 0.77; // 設定各平台表面的基準高度
    const makeBox = (parent, x, y, z, w, h, d, color, extra = {}) => { // 建立可投影陰影的方塊
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), extra.material || mat(color)); // 建立方塊幾何與材質
      mesh.position.set(x, y, z); // 設定方塊中心位置
      mesh.rotation.set(extra.rx || 0, extra.ry || 0, extra.rz || 0); // 套用方塊旋轉角度
      mesh.castShadow = extra.castShadow !== false; // 預設讓方塊投射陰影
      mesh.receiveShadow = true; // 讓方塊承接其他物件陰影
      parent.add(mesh); // 將方塊加入指定群組
      return mesh; // 回傳方塊以便後續調整
    }; // 結束方塊建立工具
    const makeCylinder = (parent, x, y, z, rt, rb, h, color, sides = 8) => { // 建立低多邊形圓柱
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, sides), mat(color)); // 建立圓柱幾何與材質
      mesh.position.set(x, y, z); // 設定圓柱中心位置
      mesh.castShadow = true; // 讓圓柱投射陰影
      mesh.receiveShadow = true; // 讓圓柱承接陰影
      parent.add(mesh); // 將圓柱加入指定群組
      return mesh; // 回傳圓柱物件
    }; // 結束圓柱建立工具
    const makeIco = (parent, x, y, z, sx, sy, sz, color, detail = 1) => { // 建立低多邊形球體
      const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1, detail), mat(color)); // 建立多面體球幾何
      mesh.position.set(x, y, z); // 設定球體中心位置
      mesh.scale.set(sx, sy, sz); // 設定球體長寬高比例
      mesh.castShadow = true; // 讓球體投射陰影
      mesh.receiveShadow = true; // 讓球體承接陰影
      parent.add(mesh); // 將球體加入指定群組
      return mesh; // 回傳球體物件
    }; // 結束低多邊形球體工具
    const stripeCanvas = document.createElement("canvas"); // 建立黃黑斜紋材質畫布
    stripeCanvas.width = 128; // 設定斜紋畫布寬度
    stripeCanvas.height = 64; // 設定斜紋畫布高度
    const stripeCtx = stripeCanvas.getContext("2d"); // 取得斜紋畫布繪圖環境
    stripeCtx.fillStyle = "#f4c335"; // 設定斜紋底色為警示黃
    stripeCtx.fillRect(0, 0, 128, 64); // 填滿黃底
    stripeCtx.fillStyle = "#30383a"; // 設定斜線顏色為深灰黑
    for (let x = -64; x < 160; x += 28) { stripeCtx.beginPath(); stripeCtx.moveTo(x, 64); stripeCtx.lineTo(x + 64, 0); stripeCtx.lineTo(x + 78, 0); stripeCtx.lineTo(x + 14, 64); stripeCtx.closePath(); stripeCtx.fill(); } // 繪製重複黑色斜線
    const stripeTexture = new THREE.CanvasTexture(stripeCanvas); // 將斜紋繪圖轉為材質貼圖
    stripeTexture.colorSpace = THREE.SRGBColorSpace; // 設定貼圖使用螢幕色彩空間
    stripeTexture.wrapS = THREE.RepeatWrapping; // 允許貼圖水平重複
    stripeTexture.wrapT = THREE.RepeatWrapping; // 允許貼圖垂直重複
    stripeTexture.repeat.set(8, 1); // 配合放大的平台增加斜紋重複密度
    const stripeMat = new THREE.MeshStandardMaterial({ map: stripeTexture, roughness: 0.8 }); // 建立黃黑警示條紋材質
    const deckMat = mat("#dfd5ba"); // 建立平台下層石材材質
    const islandSize = 17.5; // 將方形平台邊長放大為原本的二點五倍
    const islandOffset = 20.5; // 拉開外島位置以維持橋梁連接並避免平台重疊
    const buildingScale = 2.25; // 配合放大的平台提升建築群尺度
    const walkableSurfaces = []; // 記錄允許角色行走與點擊的平面
    const treeColliders = []; // 記錄樹木在地面上的碰撞範圍
    const buildingRoots = []; // 記錄需要阻擋角色的建築群組
    const obstacleMeshes = []; // 記錄獨立的建築障礙模型
    const makeIsland = (name, x, z, surfaceColor) => { // 建立方形浮島平台群組
      const group = new THREE.Group(); // 建立單座島嶼的局部群組
      group.position.set(x, 0, z); // 設定島嶼在群島中的位置
      group.userData.name = name; // 記錄島嶼識別名稱
      world.add(group); // 將島嶼加入動態群組
      const base = new THREE.Mesh(new THREE.BoxGeometry(islandSize, 0.68, islandSize), [stripeMat, stripeMat, deckMat, deckMat, stripeMat, stripeMat]); // 建立放大後黃黑條紋側面的厚平台
      base.position.y = 0.31; // 將平台底座放在水面上方
      base.castShadow = true; // 讓平台投射陰影
      base.receiveShadow = true; // 讓平台承接陰影
      group.add(base); // 將平台底座加入島嶼群組
      makeBox(group, 0, 0.69, 0, islandSize - 0.08, 0.12, islandSize - 0.08, surfaceColor); // 鋪設放大後的平台表面
      const topSurface = makeBox(group, 0, 0.765, 0, islandSize - 0.06, 0.035, islandSize - 0.06, surfaceColor, { castShadow: false }); // 加上平台表面薄層色塊
      topSurface.userData.islandName = name; // 標記可行走平台所屬島嶼
      walkableSurfaces.push(topSurface); // 將島嶼表面加入可行走射線清單
      return group; // 回傳島嶼供後續建築使用
    }; // 結束浮島平台建立工具
    const makeBuildingGroup = (island) => { // 建立以平台表面為基準放大的建築群
      const group = new THREE.Group(); // 建立獨立的建築群組
      group.scale.setScalar(buildingScale); // 依參考圖放大建築與攤販
      group.position.y = groundY * (1 - buildingScale); // 讓建築底部仍貼合平台表面
      island.add(group); // 將建築群加入所屬平台
      return group; // 回傳建築群供模型建立使用
    }; // 結束建築群組建立工具
    const addTree = (parent, x, z, scale = 1, foliage = "#84ad6b") => { // 以圓柱與多面體組成低多邊形樹
      const treeScale = scale * 2.5; // 放大樹木以接近周圍建築高度
      treeColliders.push({ x: parent.position.x + x, z: parent.position.z + z, radius: 0.62 * treeScale }); // 記錄放大後樹木的水平碰撞半徑
      makeCylinder(parent, x, groundY + 0.42 * treeScale, z, 0.13 * treeScale, 0.18 * treeScale, 0.84 * treeScale, "#73533d", 7); // 建立放大後的棕色樹幹
      makeIco(parent, x, groundY + 1.02 * treeScale, z, 0.62 * treeScale, 0.72 * treeScale, 0.62 * treeScale, foliage, 1); // 建立放大的樹冠下層
      makeIco(parent, x - 0.12 * treeScale, groundY + 1.48 * treeScale, z + 0.06 * treeScale, 0.48 * treeScale, 0.56 * treeScale, 0.48 * treeScale, foliage, 1); // 建立放大的樹冠上層
    }; // 結束低多邊形樹木工具
    const addFlowerBed = (parent, x, z) => { // 以大花朵與花盆建立低多邊形花圃
      makeBox(parent, x, groundY + 0.16, z, 1.5, 0.24, 1.2, "#b46f4e"); // 建立厚實的陶土花盆底部
      for (const side of [-1, 1]) { makeBox(parent, x + side * 0.7, groundY + 0.29, z, 0.12, 0.34, 1.2, "#c27a55"); makeBox(parent, x, groundY + 0.29, z + side * 0.54, 1.5, 0.34, 0.12, "#c27a55"); } // 圍起花盆四周的陶土盆壁
      makeBox(parent, x, groundY + 0.43, z, 1.34, 0.08, 1.02, "#829966", { castShadow: false }); // 在盆內鋪上綠色土壤
      const petals = ["#e57c78", "#f0c84f", "#fff4df", "#a58ac0", "#df9c50"]; // 設定花朵繽紛花瓣色彩
      for (let i = 0; i < 5; i++) { const angle = i * Math.PI * 0.4; const fx = x + Math.cos(angle) * 0.38; const fz = z + Math.sin(angle) * 0.3; makeCylinder(parent, fx, groundY + 0.73, fz, 0.04, 0.055, 0.6, "#557b51", 5); makeIco(parent, fx, groundY + 1.06, fz, 0.22, 0.22, 0.22, petals[i], 1); makeIco(parent, fx, groundY + 1.06, fz, 0.075, 0.075, 0.075, "#f5d875", 1); } // 種下放大的花朵並點綴花心
    }; // 結束花圃建立工具
    const addChristmasTree = (parent, x, z) => { // 建立掛有彩球與星星的低多邊形聖誕樹
      const treeScale = 1.6; // 放大聖誕樹使高度接近校舍

        pigeon.position.set(Math.cos(pigeonAngle) * 5.2, groundY + 5.2 + Math.sin(time * 2.6) * 0.3, Math.sin(pigeonAngle) * 4.7); // 讓鴿子在店屋與河岸步道上方緩慢盤旋
        pigeon.rotation.y = Math.atan2(-Math.sin(pigeonAngle) * 5.2, Math.cos(pigeonAngle) * 4.7); // 讓鴿子沿飛行方向轉身
        for (const { wing, side } of pigeonWings) { wing.rotation.z = side * (0.18 + Math.sin(time * 9) * 0.48); } // 讓鴿子左右翅膀持續拍動
        refreshPedestrianColliders(); // 依老街路人與騎士的本影位置更新主角碰撞範圍
        updatePlayer(p, deltaTime); // 更新主角移動與碰撞
        collectNearbyStamps(); // 主角走進集章圓圈時蓋章並更新資訊
        const dogStride = dachshund.userData.walking ? Math.sin(time * 9) * 0.5 : 0; // 依主角是否前進計算狗狗步伐
        for (const [index, leg] of dachshund.userData.legs.entries()) { leg.rotation.z = dogStride * (index === 0 || index === 3 ? 1 : -1); } // 讓狗狗前後腳交錯擺動並在停下時站定
        for (const ripple of ripples) { ripple.line.position.x += Math.sin(time * 0.35 + ripple.phase) * 0.0015; ripple.line.material.opacity = 0.3 + (Math.sin(time * 1.3 + ripple.phase) + 1) * 0.12; } // 讓水面波紋緩慢流動與淡入淡出
        for (const boat of watercrafts) { const angle = time * boat.angularSpeed + boat.phase; const position = boatCoordinatesAt(boat, angle); const nextPosition = boatCoordinatesAt(boat, angle + 0.002); boat.vessel.position.set(position.x, -0.28 + Math.sin(time * 1.4 + boat.phase) * 0.025, position.z); boat.vessel.rotation.y = Math.atan2(nextPosition.x - position.x, nextPosition.z - position.z); boat.vessel.rotation.x = Math.sin(time * 0.9 + boat.phase) * 0.018; boat.vessel.rotation.z = Math.cos(time * 0.8 + boat.phase) * 0.018; } // 讓船隻依各自不同速率與形狀沿航道前進並隨波起伏
        for (const walker of walkers) { animateWalk(walker, time); } // 逐一更新每位路人的手腳擺動
        const followPoint = protagonist.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 1.6, 0)); // 計算攝影機應跟隨的主角上半身位置
        const previousTarget = controls.target.clone(); // 記錄平滑跟隨前的鏡頭目標
        controls.target.lerp(followPoint, 1 - Math.exp(-4.5 * deltaTime)); // 平滑移動鏡頭旋轉中心
        camera.position.add(controls.target.clone().sub(previousTarget)); // 平移攝影機以保持原有斜俯視角
        controls.update(); // 更新鏡頭阻尼與滑鼠控制
        drawStampLabels(p); // 以 p5.js 繪製五個可點選的集章膠囊標籤
        const calloutPosition = vendor.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 3.85, 0)).project(camera); // 取得老闆上方的叫賣對話框投影座標
        vendorCall.style.left = `${(calloutPosition.x * 0.5 + 0.5) * window.innerWidth}px`; // 將叫賣對話框水平定位在老闆上方
        vendorCall.style.top = `${(-calloutPosition.y * 0.5 + 0.5) * window.innerHeight}px`; // 將叫賣對話框垂直定位在老闆上方
        vendorCall.style.opacity = calloutPosition.z < 1 && Math.abs(calloutPosition.x) < 1.15 && Math.abs(calloutPosition.y) < 1.15 ? "1" : "0"; // 只在老闆位於鏡頭範圍時顯示叫賣文字
        renderer.render(scene, camera); // 由 Three.js 繪製目前的三維場景
      }; // 結束 p5.js draw 主迴圈
    }; // 結束 p5.js 實例模式設定
    new p5(loop, document.body); // 啟動 p5.js 實例模式主迴圈
  </script> <!-- 結束 Three.js 場景程式 -->
